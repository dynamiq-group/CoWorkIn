name: CI Build & Test

on:
  pull_request:
    branches: [main]

jobs:
  verify-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' 

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Test Production Build
        run: npm run build
        env:
          # Next.js requires dummy env vars during build time if they are hardcoded
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "mock_key"
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"